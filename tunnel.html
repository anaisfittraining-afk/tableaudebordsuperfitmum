.link{background:none;border:none;color:var(--green);text-decoration:underline;font-family:inherit;font-size:13px;cursor:pointer;margin-top:12px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* ── Nouveau format « Ton appel Bilan » (guide de préparation) ── */

function pick(id){S.offre=id;var o=offerById(id),sl=S.creneau&&CRENEAUX[S.creneau];if(sl&&!slotsFor(o).some(function(x){return x.id===S.creneau}))S.creneau='';S.noSlot=false;render()}
function pickSlot(id){S.creneau=id;S.noSlot=false;render()}
function skipSlot(){S.noSlot=!S.noSlot;if(S.noSlot)S.creneau='';render()}
function back(){S.step=Math.max(1,S.step-1);render();window.scrollTo(0,0)}
function showErr(m){var e=document.getElementById('err');if(e){e.textContent=m;e.style.display='block'}}
function next(){
  if(S.step===1){if(!S.offre)return;S.step=2;render();window.scrollTo(0,0);return}
  if(S.step===2){
    S.nom=document.getElementById('nom').value.trim();S.email=document.getElementById('email').value.trim();S.tel=document.getElementById('tel').value.trim();S.consent=document.getElementById('consent').checked;
    if(!S.nom)return showErr('Merci d\'indiquer ton nom et prénom.');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.email))return showErr('Cette adresse e-mail ne semble pas valide.');
    if(S.tel.replace(/\D/g,'').length<9)return showErr('Merci d\'indiquer un numéro de téléphone valide.');
    if(!S.consent)return showErr('Merci de cocher la case pour continuer.');

function leadData(status){
  var o=offerById(S.offre)||{},sl=S.creneau&&CRENEAUX[S.creneau]||{};
  var d={funnel:FID,lieu:F.lieu||'desvres',nom:S.nom,email:S.email,telephone:S.tel,offreId:S.offre,offreLabel:o.label||'',offrePrix:o.prix||'',
    creneauId:S.creneau||'',creneauDate:sl.date||'',creneauHeure:sl.heure||'',status:status,updatedAt:new Date().toISOString(),
    source:Q.get('utm_source')||Q.get('src')||(document.referrer?'lien':'direct')};

}
function saveLead(status){
  if(!db)return;
  try{
    if(!S.leadId){S.leadId=db.ref('acquisition/leads').push().key;var d=leadData(status);d.createdAt=d.updatedAt;db.ref('acquisition/leads/'+S.leadId).set(d)}
    else db.ref('acquisition/leads/'+S.leadId).update(leadData(status));
  }catch(e){}
}
function finish(){
  var o=offerById(S.offre);if(!o||S.busy)return;
  S.busy=true;render();
  var status=o.lien?'paiement_ouvert':'nouveau';
  saveLead(status);
  try{localStorage.setItem('sfm_tunnel_lead',JSON.stringify({id:S.leadId,f:FID,at:Date.now()}))}catch(e){}
  setTimeout(function(){
    if(o.lien){
      var u=o.lien+(o.lien.indexOf('?')<0?'?':'&')+'prefilled_email='+encodeURIComponent(S.email)+'&client_reference_id='+encodeURIComponent(S.leadId);
      location.href=u;
    }else{
      root().innerHTML='<div class="wrap"><div class="card big"><div class="em">🌿</div><h2>Merci '+esc(S.nom.split(' ')[0])+' !</h2><p class="hint">Ta demande est bien enregistrée. Anaïs te recontacte très vite pour finaliser ton inscription.</p></div>'+foot()+'</div>';window.scrollTo(0,0)
    }
  },350);
}
function renderMerci(){
  if(F.type==='appel'||F.type==='vente')return eMerci();
  var rec=null;try{rec=JSON.parse(localStorage.getItem('sfm_tunnel_lead')||'null')}catch(e){}
  var first='';
  if(rec&&rec.id&&db){
    db.ref('acquisition/leads/'+rec.id).once('value').then(function(sn){
      var d=sn.val();if(!d)return;
      var now=new Date().toISOString();
      db.ref('acquisition/leads/'+rec.id).update({status:'paye',paidAt:now,updatedAt:now});
      db.ref('reservations/pendingValidations/'+rec.id).once('value').then(function(p){
        if(p.val())return;
        db.ref('reservations/pendingValidations/'+rec.id).set({nom:d.nom||'',email:d.email||'',telephone:d.telephone||'',lieu:d.lieu||'desvres',creneauId:d.creneauId||'',creneauDate:d.creneauDate||'',creneauHeure:d.creneauHeure||'',offre:d.offreLabel||'',montant:d.offrePrix||'',paiement:'paye',paidAt:now,source:'tunnel',leadId:rec.id,createdAt:now,status:'en_attente'});
      });
      try{localStorage.removeItem('sfm_tunnel_lead')}catch(e){}
      var el=document.getElementById('mprenom');if(el)el.textContent=(d.nom||'').split(' ')[0];
      tMail('paye',{leadId:rec.id,nom:d.nom,email:d.email,tel:d.telephone,offre:d.offreLabel,prix:d.offrePrix});
    });
  }
  root().innerHTML='<div class="wrap"><div class="card big"><div class="em">🎉</div><h2>Merci <span id="mprenom"></span> !</h2><p class="hint">'+esc(F.merciTexte||'Ton paiement est bien reçu. Anaïs valide ta place et te confirme tout par message très vite.')+'</p></div>'+foot()+'</div>';
}
function init(){
  F=null;
  try{firebase.initializeApp(FB_CONFIG);db=firebase.database()}catch(e){}
  if(!Q.get('f')&&(Q.get('index')||location.protocol==='file:')){tIndex();return}
  var fallback=function(){F=DEFAULT_FUNNELS[FID]||DEFAULT_FUNNELS.desvres;if(F.type==='appel'||F.type==='vente'){eStart();return}render()};
  if(!db){fallback();return}
  db.ref('acquisition/funnels/'+FID).once('value').then(function(sn){
    F=sn.val()||DEFAULT_FUNNELS[FID]||DEFAULT_FUNNELS.desvres;
    if(F.type==='appel'||F.type==='vente'){eStart();return}
    if(Q.get('offre')&&offerById(Q.get('offre'))){S.offre=Q.get('offre')}
    // visite comptée une fois par session
    try{if(!sessionStorage.getItem('sfm_v_'+FID)&&!Q.get('apercu')&&!Q.get('merci')){sessionStorage.setItem('sfm_v_'+FID,'1');db.ref('acquisition/stats/'+FID+'/'+today()+'/vues').transaction(function(v){return (v||0)+1})}}catch(e){}
    render();
    db.ref('acquisition/media/'+FID+'/flyer').once('value').then(function(s){var v=s.val();if(v&&v.dataUrl){FLYER=v.dataUrl;render()}}).catch(function(){});
    db.ref('reservations/creneaux').on('value',function(s){CRENEAUX=s.val()||{};if(S.step===3)render()});
  }).catch(fallback);
  setTimeout(function(){if(!F)fallback()},6000);
}

  var key=s.date+'_'+s.hm.replace(':',''),pay=String(F.paiementLien||'').trim();
  db.ref('acquisition/appels/'+key).transaction(function(c){
    var stale=c&&c.pending&&(Date.now()-Date.parse(c.at||0)>1800000); // retenue non payée depuis plus de 30 min : le créneau est libéré
    return (c&&!stale)?undefined:{leadId:ES.leadId,dur:s.dur,at:new Date().toISOString(),pending:!!pay};
  }).then(function(r){
    if(!r.committed){ES.busy=false;ES.slot=null;ES.err='Ce créneau vient d\'être pris. Choisis-en un autre.';eLoadSlots();return}
    var now=new Date().toISOString();

function eVenteInfos(){

function eEnsureContract(){

  var rec={nom:nom,prenom:prenom,adresse:ES.adresse,email:ES.email,telephone:ES.tel,sexe:'f',formule:(o.formuleContrat==='bilanmensuel'||o.formuleContrat==='reduite')?o.formuleContrat:'complete',offer:o.engagement==='12mois'?'12mois':'4mois',tarifBase:eTarif(o),tarifRemise:'',montantAici:eAici(o),resteCharge:eAici(o),essaiJours:Math.max(0,parseInt(ej,10)||0),essaiTexte:F.essaiTexte||'',paiement:o.paiement==='echu'?'echu':'',source:'tunnel',funnel:FID,leadId:ES.leadId||''};

var SIG={drawing:false,dirty:false};
function eSigInit(){
  var c=document.getElementById('sig');if(!c)return;var w=c.parentNode.clientWidth||300;c.width=w;var x=c.getContext('2d');x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#2F4A3A';SIG.dirty=false;

  c.onpointerdown=function(e){SIG.drawing=true;var p=pos(e);x.beginPath();x.moveTo(p[0],p[1]);c.setPointerCapture(e.pointerId);e.preventDefault()};
  c.onpointermove=function(e){if(!SIG.drawing)return;var p=pos(e);x.lineTo(p[0],p[1]);x.stroke();SIG.dirty=true;e.preventDefault()};
  c.onpointerup=c.onpointercancel=function(){SIG.drawing=false};
}
function eSigClear(){var c=document.getElementById('sig');if(!c)return;c.getContext('2d').clearRect(0,0,c.width,c.height);SIG.dirty=false}

    return Promise.race([tMail('signe',{leadId:id,nom:ES.nom,email:ES.email,tel:ES.tel,offre:o.label,prix:o.prix}),new Promise(function(r){setTimeout(r,2000)})]);
  }).then(function(){
    if(o.lien){location.href=o.lien+(o.lien.indexOf('?')<0?'?':'&')+'prefilled_email='+encodeURIComponent(ES.email)+'&client_reference_id='+encodeURIComponent(id)}
    else{ES.busy=false;ES.step='fin';eFin(false)}

function eFin(paid){
  document.body.classList.add('e');
  var h=eHead()+'<div class="card big"><div class="em">🌿</div><h2>'+(paid?'Bienvenue':'Merci')+' '+esc(eFirst())+' !</h2><p class="hint">'+esc(paid?(F.merciTexte||'Ton paiement est bien reçu et ton contrat est signé. Bienvenue dans co-NAÎTRE !'):'Ton contrat est signé. Anaïs te recontacte très vite pour finaliser ton inscription et le paiement.')+'</p></div>';

function eMerciAppel(rec){
  document.body.classList.add('e');
  var slotOf=function(d){var w=d&&(d.rdvAttente||(d.rdvTs?{date:d.rdvDate,hm:d.rdvHeure,dur:d.rdvDuree,ts:d.rdvTs}:null));if(!w)return null;var ts=Date.parse(w.ts),dur=+w.dur||30;return {date:w.date,hm:w.hm,dur:dur,ts:ts,end:ts+dur*60000}};

function eMerci(){

function eStart(){

// ---------- page d'index (réservée à la coach) : liste tous les tunnels avec leur adresse ----------
function tIndex(){

    var base=location.href.replace(/[?#].*$/,''),groups={espace:[],pilates:[]};
    Object.keys(DEFAULT_FUNNELS).forEach(function(id){
      var f=Object.assign({},DEFAULT_FUNNELS[id],over[id]||{});

    });

        var u=base+'?f='+x.id;
        return '<div style="padding:10px 0;border-top:1px solid var(--border)"><div style="font-weight:700">'+esc(x.nom)+(x.active?'':' <span style="color:#B96A46;font-weight:600">(fermé)</span>')+'</div>'
          +'<div style="font-size:12px;color:var(--muted);word-break:break-all;margin:3px 0 8px">'+esc(u)+'</div>'
          +'<a class="btn" style="display:inline-block;width:auto;padding:8px 16px;text-decoration:none" href="'+esc(u+'&apercu=1')+'">Voir ce tunnel</a></div>';
      }).join('')+'</div>';

      +block('Mon espace co-NAÎTRE',groups.espace)+block('Pilates — co-NAÎTRE en mouvement',groups.pilates)+eFoot()+'</div>';
  };
  draw({});
  if(db)db.ref('acquisition/funnels').once('value').then(function(sn){draw(sn.val()||{})}).catch(function(){});
}
// ---------- e-mails automatiques (configurés dans le tableau de bord → Acquisition → E-mails automatiques) ----------
var MAILCFG=null;
function tFill(s,v){return String(s||'').replace(/\{\{(\w+)\}\}/g,function(m,k){return v[k]==null?'':v[k]})}
function tMailRaw(c,to,sujet,corps,v){
  var e=c.ejs||{};if(!e.pub||!e.service||!e.template||!to)return Promise.resolve(false);
  return fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:e.service,template_id:e.template,user_id:e.pub,template_params:{to_email:to,subject:tFill(sujet,v),message:tFill(corps,v),from_name:e.fromName||'Anaïs — co-NAÎTRE',reply_to:e.replyTo||e.coachEmail||''}})}).then(function(r){return r.ok}).catch(function(){return false});
}
function tMail(ev,v){
  v=v||{};if(!db||!v.leadId)return Promise.resolve(false);
  var get=MAILCFG?Promise.resolve(MAILCFG):db.ref('acquisition/emails').once('value').then(function(s){MAILCFG=s.val()||{};return MAILCFG});
  return get.then(function(c){
    var t=((c.tpl||{})[FID]||{})[ev],jobs=[];
    var base=location.href.replace(/[?#].*$/,'');
    var vars={prenom:(v.nom||'').split(' ')[0],nom:v.nom||'',offre:v.offre||'',prix:v.prix||'',tunnel:F.nom||FID,lien_tunnel:base+'?f='+FID,lien_contrat:ES.cid?base+'?f='+FID+'&c='+ES.cid:base+'?f='+FID,modalite:(F.agenda&&F.agenda.modalite)||'',date_rdv:v.date_rdv||'',heure_rdv:v.heure_rdv||'',lien_agenda:v.lien_agenda||'',lien_salle:v.leadId?eSalleUrl(v.leadId):'',lien_guide:eGuideUrl(),lien_reservation:'',formule:'',seances_txt:''};
    var claim=function(key){return db.ref('acquisition/leads/'+v.leadId+'/mails/'+key).transaction(function(x){return x?undefined:new Date().toISOString()}).then(function(r){return r.committed})};
    if(t&&t.on&&v.email)jobs.push(claim(ev).then(function(ok){return ok?tMailRaw(c,v.email,t.sujet,t.corps,vars):false}));
    if((c.coach||{})[FID]&&(c.ejs||{}).coachEmail){
      var lab={lead:'Nouvelle prospecte',rdv:'Appel réservé',signe:'Contrat signé',paye:'Paiement reçu'}[ev];
      if(lab)jobs.push(claim('coach_'+ev).then(function(ok){return ok?tMailRaw(c,c.ejs.coachEmail,'🎯 '+lab+' : '+(v.nom||'')+' ('+(F.nom||FID)+')',lab+'\n\nNom : '+(v.nom||'')+'\nE-mail : '+(v.email||'')+'\nTéléphone : '+(v.tel||'')+(v.offre?'\nFormule : '+v.offre+' '+(v.prix||''):'')+(v.date_rdv?'\nRendez-vous : '+v.date_rdv+' à '+v.heure_rdv:'')+'\n\nÀ retrouver dans ton tableau de bord → Aujourd\'hui.',{}):false}))
    }
    return Promise.all(jobs);
  }).catch(function(){return false});
}
